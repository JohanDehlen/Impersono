[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "impersono"
version = "0.1.0.dev0"
description = "Professional local AI voice creation."
requires-python = ">=3.12,<3.13"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]